<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline • C@mpBite</title>
  <!-- CAMPBITE_OFFLINE_SHELL_V2 -->
  <script>
    (function() {
      try {
        var stored = localStorage.getItem("theme");
        var isDark = false;
        if (stored === "dark") {
          isDark = true;
        } else if (stored === "light") {
          isDark = false;
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          isDark = true;
        }
        if (isDark) document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      } catch(e) {
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      }
    })();
  </script>
  <style>
    :root {
      --bg: #f5efe4;
      --fg: #181513;
      --card: #eae2d2;
      --border: #d4c7b0;
      --muted: #78716c;
      --primary: #d9531e;
      --primary-fg: #ffffff;
      --canvas-bg: #fefcf8;
      --canvas-ground: #854d0e;
    }
    html.dark {
      --bg: #0b0d12;
      --fg: #e2e8f0;
      --card: #151720;
      --border: #2a2e3d;
      --muted: #a1a1aa;
      --primary: #d9531e;
      --primary-fg: #ffffff;
      --canvas-bg: #0f121a;
      --canvas-ground: #334155;
    }
    @media (prefers-color-scheme: dark) {
      :root:not(.light) {
        --bg: #0b0d12;
        --fg: #e2e8f0;
        --card: #151720;
        --border: #2a2e3d;
        --muted: #a1a1aa;
        --primary: #d9531e;
        --primary-fg: #ffffff;
        --canvas-bg: #0f121a;
        --canvas-ground: #334155;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      text-align: center;
      transition: background-color 0.2s, color 0.2s;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.75rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
    .wordmark-wrap {
      margin-bottom: 1.25rem;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wordmark {
      height: 26px;
      width: auto;
      display: block;
      user-select: none;
    }
    .wordmark-dark { display: none; }
    .wordmark-light { display: block; }
    html.dark .wordmark-dark { display: block; }
    html.dark .wordmark-light { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not(.light) .wordmark-dark { display: block; }
      :root:not(.light) .wordmark-light { display: none; }
    }
    .cloche-wrap {
      width: 72px;
      height: 72px;
      border-radius: 1.25rem;
      background: rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      color: var(--primary);
    }
    html.dark .cloche-wrap {
      background: rgba(255, 255, 255, 0.05);
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .safe-text {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.375rem;
      line-height: 1.4;
    }
    .desc-text {
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.85;
      line-height: 1.4;
      margin-bottom: 1.5rem;
      max-width: 280px;
    }
    .button-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }
    .retry-btn {
      width: 100%;
      min-height: 44px;
      height: 44px;
      background-color: var(--primary);
      color: var(--primary-fg);
      border: none;
      border-radius: 0.75rem;
      font-size: 0.8125rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.075s, opacity 0.15s;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    .retry-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }
    .retry-btn svg {
      width: 16px;
      height: 16px;
    }
    .game-launch-btn {
      width: 100%;
      min-height: 44px;
      height: 44px;
      background-color: rgba(0, 0, 0, 0.05);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      font-size: 0.8125rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.075s, background-color 0.15s;
    }
    html.dark .game-launch-btn {
      background-color: rgba(255, 255, 255, 0.06);
    }
    .game-launch-btn:active {
      transform: scale(0.97);
    }
    .game-launch-btn svg {
      width: 16px;
      height: 16px;
      color: var(--primary);
    }
    .footer-note {
      margin-top: 1.25rem;
      font-size: 0.6875rem;
      color: var(--muted);
      letter-spacing: 0.01em;
    }
    /* Offline Mini-Game Container */
    #offline-game-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .game-top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .game-back-btn {
      min-height: 36px;
      padding: 0 0.75rem;
      background: none;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--fg);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .game-score-box {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8125rem;
      font-weight: 700;
      display: flex;
      gap: 0.75rem;
    }
    .game-score-box .hi {
      color: var(--muted);
    }
    .canvas-wrapper {
      width: 100%;
      max-width: 375px;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow: hidden;
      background: var(--canvas-bg);
      touch-action: none;
      position: relative;
    }
    #offline-game-canvas {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
    }
    .game-help {
      margin-top: 0.5rem;
      font-size: 0.6875rem;
      color: var(--muted);
    }
  </style>
</head>

        <button type="button" class="game-back-btn" id="close-game-btn" aria-label="Back to offline status">
          ← Back
        </button>
        <div class="game-score-box">
          <span class="hi" id="game-hi-display">HI 00000</span>
          <span id="game-score-display">00000</span>
        </div>
      </div>
      <div class="canvas-wrapper">
        <canvas id="offline-game-canvas" width="375" height="180"></canvas>
      </div>
      <p class="game-help">Tap / Space to Jump • Down / Hold to Fast-Fall</p>
    </div>

    <p class="footer-note">C@mpBite • Smart Pre-Order System</p>
  </main>

  <script>
    (function() {
      // 1. Connection reload handling (throttled to 5 seconds)
      var lastReload = 0;
      function safeReload() {
        var now = Date.now();
        if (now - lastReload >= 5000) {
          lastReload = now;
          window.location.reload();
        }
      }
      var retryBtn = document.getElementById("retry-btn");
      if (retryBtn) {
        retryBtn.addEventListener("click", function() {
          safeReload();
        });
      }
      window.addEventListener("online", function() {
        safeReload();
      });

      // 2. View toggle (Main Offline View <-> Game View)
      var mainView = document.getElementById("offline-main-view");
      var gameContainer = document.getElementById("offline-game-container");
      var playBtn = document.getElementById("play-game-btn");
      var closeBtn = document.getElementById("close-game-btn");
      var gameInitialized = false;

      playBtn.addEventListener("click", function() {
        mainView.style.display = "none";
        gameContainer.style.display = "flex";
        if (!gameInitialized) {
          gameInitialized = true;
          initOfflineGame();
        }
      });

      closeBtn.addEventListener("click", function() {
        gameContainer.style.display = "none";
        mainView.style.display = "flex";
      });

      // 3. Standalone Offline Mini-Game (Burger Jump)
      function initOfflineGame() {
        var canvas = document.getElementById("offline-game-canvas");
        if (!canvas || !canvas.getContext) return;
        var ctx = canvas.getContext("2d");

        // Physical constants matching src/lib/offline-game.ts exactly
        var JUMP_TARGET_DISTANCE_START = 205;
        var JUMP_TARGET_DISTANCE_END = 126;
        var JUMP_PEAK_HEIGHT = 86;
        var FAST_FALL_MULTIPLIER = 2.2;
        var INITIAL_SPEED = 2.5;
        var MAX_SPEED = 8.5;
        var SPEED_RAMP_FRAMES = 4500;
        var GROUND_Y = 145;
        var BURGER_WIDTH = 34;
        var BURGER_HEIGHT_NORMAL = 34;
        var BURGER_HEIGHT_DUCK = 20;
        var HIGH_SCORE_KEY = "cc_offline_highscore_v1";

        // Read stored high score
        var highScore = 0;
        try {
          var saved = localStorage.getItem(HIGH_SCORE_KEY);
          if (saved) {
            var parsed = parseInt(saved, 10);
            if (!isNaN(parsed) && parsed > 0) highScore = Math.min(parsed, 999999);
          }
        } catch(e) {}

        var hiEl = document.getElementById("game-hi-display");
        var scoreEl = document.getElementById("game-score-display");
        function updateScoreDisplays(cur) {
          if (hiEl) hiEl.textContent = "HI " + String(Math.floor(highScore)).padStart(5, "0");
          if (scoreEl) scoreEl.textContent = String(Math.floor(cur)).padStart(5, "0");
        }
        updateScoreDisplays(0);

        // Game state
        var isPlaying = false;
        var isGameOver = false;
        var score = 0;
        var speed = INITIAL_SPEED;
        var player = {
          x: 45,
          y: GROUND_Y - BURGER_HEIGHT_NORMAL,
          vy: 0,
          width: BURGER_WIDTH,
          height: BURGER_HEIGHT_NORMAL,
          isGrounded: true,
          jumpGravity: 0.78,
          isDucking: false
        };
        var obstacles = [];
        var nextObstacleDist = 320;
        var nextObstacleId = 1;
        var inputJump = false;
        var inputDuck = false;
        var jumpBuffer = false;

        function getTargetJumpDistance(sp) {
          var clamped = Math.min(Math.max(sp, INITIAL_SPEED), MAX_SPEED);
          var progress = (clamped - INITIAL_SPEED) / (MAX_SPEED - INITIAL_SPEED);
          return JUMP_TARGET_DISTANCE_START - (JUMP_TARGET_DISTANCE_START - JUMP_TARGET_DISTANCE_END) * progress;
        }

        function calculateJumpPhysics(sp) {
          var dist = getTargetJumpDistance(sp);
          var airtime = dist / Math.max(sp, 0.1);
          var v0 = -(4 * JUMP_PEAK_HEIGHT) / airtime;
          var g = (8 * JUMP_PEAK_HEIGHT) / (airtime * airtime);
          return { v0: v0, gravity: g };
        }

        function calculateSpeed(sc) {
          var prog = Math.min(Math.max(sc, 0) / SPEED_RAMP_FRAMES, 1);
          var raw = INITIAL_SPEED + (MAX_SPEED - INITIAL_SPEED) * prog;
          return Math.min(Math.round(raw * 100) / 100, MAX_SPEED);
        }

        function spawnObstacle() {
          var isDrink = Math.random() > 0.5;
          var roll = Math.random();
          var w, h;
          if (isDrink) {
            if (roll < 0.4) { w = 18; h = 26; }
            else if (roll < 0.75) { w = 22; h = 32; }
            else { w = 26; h = 38; }
          } else {
            if (roll < 0.4) { w = 30; h = 18; }
            else if (roll < 0.75) { w = 34; h = 26; }
            else { w = 38; h = 34; }
          }
          obstacles.push({
            id: nextObstacleId++,
            isDrink: isDrink,
            x: 375,
            y: GROUND_Y - h,
            w: w,
            h: h
          });
          var targetD = getTargetJumpDistance(speed);
          var clearance = Math.ceil(targetD + 38 + 34 + 40);
          var baseGap = Math.max(280, clearance);
          var earlyBonus = Math.round(100 * (1 - Math.min(score / SPEED_RAMP_FRAMES, 1)));
          nextObstacleDist = baseGap + earlyBonus + Math.floor(Math.random() * 120);
        }

        function resetGame() {
          isPlaying = true;
          isGameOver = false;
          score = 0;
          speed = INITIAL_SPEED;
          player.y = GROUND_Y - BURGER_HEIGHT_NORMAL;
          player.vy = 0;
          player.isGrounded = true;
          player.isDucking = false;
          player.height = BURGER_HEIGHT_NORMAL;
          obstacles = [];
          nextObstacleDist = 320;
          nextObstacleId = 1;
        }

        function triggerJump() {
          if (isGameOver) {
            resetGame();
            return;
          }
          if (!isPlaying) {
            isPlaying = true;
          }
          if (player.isGrounded) {
            var phys = calculateJumpPhysics(speed);
            player.vy = phys.v0;
            player.jumpGravity = phys.gravity;
            player.isGrounded = false;
          } else {
            jumpBuffer = true;
          }
        }

        // Input listeners
        window.addEventListener("keydown", function(e) {
          if (e.code === "Space" || e.code === "ArrowUp") {
            e.preventDefault();
            triggerJump();
          } else if (e.code === "ArrowDown") {
            e.preventDefault();
            inputDuck = true;
          }
        });
        window.addEventListener("keyup", function(e) {
          if (e.code === "ArrowDown") {
            inputDuck = false;
          }
        });

        canvas.addEventListener("touchstart", function(e) {
          e.preventDefault();
          triggerJump();
        }, { passive: false });

        canvas.addEventListener("mousedown", function(e) {
          triggerJump();
        });

        // Drawing helpers
        function drawBurger(px, py, pw, ph, ducking) {
          ctx.save();
          // Top Bun
          ctx.fillStyle = "#D97706";
          ctx.beginPath();
          ctx.roundRect(px, py, pw, ducking ? 7 : 11, [7, 7, 2, 2]);
          ctx.fill();
          // Sesame seeds
          if (!ducking) {
            ctx.fillStyle = "#FDE68A";
            ctx.fillRect(px + 8, py + 3, 3, 2);
            ctx.fillRect(px + 16, py + 2, 3, 2);
            ctx.fillRect(px + 24, py + 4, 3, 2);
          }
          // Lettuce
          ctx.fillStyle = "#16A34A";
          ctx.fillRect(px + 1, py + (ducking ? 7 : 11), pw - 2, 3);
          // Cheese
          ctx.fillStyle = "#EAB308";
          ctx.fillRect(px + 2, py + (ducking ? 10 : 14), pw - 4, 3);
          // Patty
          ctx.fillStyle = "#78350F";
          ctx.beginPath();
          ctx.roundRect(px, py + (ducking ? 13 : 17), pw, ducking ? 4 : 8, 3);
          ctx.fill();
          // Bottom bun
          ctx.fillStyle = "#D97706";
          ctx.beginPath();
          ctx.roundRect(px, py + ph - (ducking ? 4 : 7), pw, ducking ? 4 : 7, [2, 2, 5, 5]);
          ctx.fill();
          ctx.restore();
        }

        function drawObstacle(obs) {
          ctx.save();
          if (obs.isDrink) {
            // Cup body
            ctx.fillStyle = "#EF4444";
            ctx.beginPath();
            ctx.roundRect(obs.x + 2, obs.y + 6, obs.w - 4, obs.h - 6, [2, 2, 4, 4]);
            ctx.fill();
            // Lid
            ctx.fillStyle = "#F3F4F6";
            ctx.fillRect(obs.x, obs.y + 4, obs.w, 4);
            // Straw
            ctx.fillStyle = "#F59E0B";
            ctx.fillRect(obs.x + obs.w / 2 - 1, obs.y, 3, 6);
          } else {
            // Trays
            ctx.fillStyle = "#64748B";
            var count = obs.h <= 20 ? 1 : obs.h <= 28 ? 2 : 3;
            var step = obs.h / count;
            for (var i = 0; i < count; i++) {
              ctx.fillRect(obs.x, obs.y + i * step + 1, obs.w, step - 2);
            }
          }
          ctx.restore();
        }

        // Main game loop
        function gameLoop() {
          // Physics update
          if (isPlaying && !isGameOver) {
            score++;
            speed = calculateSpeed(score);

            // Handle Ducking
            if (inputDuck && player.isGrounded) {
              player.isDucking = true;
              player.height = BURGER_HEIGHT_DUCK;
              player.y = GROUND_Y - BURGER_HEIGHT_DUCK;
            } else {
              player.isDucking = false;
              player.height = BURGER_HEIGHT_NORMAL;
            }

            // Airborne physics
            if (!player.isGrounded) {
              var effG = inputDuck ? player.jumpGravity * FAST_FALL_MULTIPLIER : player.jumpGravity;
              player.vy += effG;
              player.y += player.vy;

              var targetGround = GROUND_Y - player.height;
              if (player.y >= targetGround) {
                player.y = targetGround;
                player.vy = 0;
                player.isGrounded = true;
                if (jumpBuffer) {
                  jumpBuffer = false;
                  triggerJump();
                }
              }
            }

            // Move obstacles
            nextObstacleDist -= speed;
            if (nextObstacleDist <= 0) {
              spawnObstacle();
            }

            for (var i = obstacles.length - 1; i >= 0; i--) {
              var obs = obstacles[i];
              obs.x -= speed;
              if (obs.x + obs.w < 0) {
                obstacles.splice(i, 1);
                continue;
              }

              // Collision check with fair padding (4px X, 3px Y)
              var padX = 4, padY = 3;
              var pL = player.x + padX;
              var pR = player.x + player.width - padX;
              var pT = player.y + padY;
              var pB = player.y + player.height;

              var oL = obs.x + padX;
              var oR = obs.x + obs.w - padX;
              var oT = obs.y + padY;
              var oB = obs.y + obs.h;

              if (pR > oL && pL < oR && pB > oT && pT < oB) {
                isGameOver = true;
                if (score > highScore) {
                  highScore = score;
                  try {
                    localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
                  } catch(e) {}
                }
              }
            }

            updateScoreDisplays(score);
          }

          // Render
          var isDark = document.documentElement.classList.contains("dark");
          ctx.fillStyle = isDark ? "#0f121a" : "#fefcf8";
          ctx.fillRect(0, 0, 375, 180);

          // Draw Ground Line
          ctx.strokeStyle = isDark ? "#334155" : "#d4c7b0";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, GROUND_Y);
          ctx.lineTo(375, GROUND_Y);
          ctx.stroke();

          // Draw Obstacles
          for (var j = 0; j < obstacles.length; j++) {
            drawObstacle(obstacles[j]);
          }

          // Draw Player
          drawBurger(player.x, player.y, player.width, player.height, player.isDucking);

          // Draw Start/Game Over overlay
          if (!isPlaying && !isGameOver) {
            ctx.fillStyle = isDark ? "#e2e8f0" : "#181513";
            ctx.font = "bold 13px system-ui, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("TAP OR PRESS SPACE TO RUN", 187, 85);
          } else if (isGameOver) {
            ctx.fillStyle = isDark ? "#ef4444" : "#dc2626";
            ctx.font = "bold 16px system-ui, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", 187, 75);
            ctx.fillStyle = isDark ? "#94a3b8" : "#64748b";
            ctx.font = "12px system-ui, sans-serif";
            ctx.fillText("TAP TO TRY AGAIN", 187, 98);
          }

          requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
      }
    })();
  </script>
</body>
</html>
